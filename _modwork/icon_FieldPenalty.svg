<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#0D3B0F"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6D4C41"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="redBan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F44336"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="shadowSm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="256" height="256" rx="28" ry="28" fill="url(#bg)"/>
  <rect x="3" y="3" width="250" height="250" rx="26" ry="26" fill="none" stroke="#2E7D32" stroke-width="2" opacity="0.5"/>

  <!-- Field area (bottom half) -->
  <clipPath id="fieldClip">
    <rect x="20" y="130" width="216" height="106" rx="12"/>
  </clipPath>
  <g clip-path="url(#fieldClip)">
    <!-- Soil base -->
    <rect x="20" y="130" width="216" height="106" fill="url(#soil)"/>
    
    <!-- Furrow lines (plowed field look) -->
    <g stroke="#5D4037" stroke-width="1" opacity="0.6">
      <line x1="20" y1="145" x2="236" y2="145"/>
      <line x1="20" y1="160" x2="236" y2="160"/>
      <line x1="20" y1="175" x2="236" y2="175"/>
      <line x1="20" y1="190" x2="236" y2="190"/>
      <line x1="20" y1="205" x2="236" y2="205"/>
      <line x1="20" y1="220" x2="236" y2="220"/>
    </g>

    <!-- Green crop rows -->
    <g opacity="0.85">
      <!-- Row A -->
      <g transform="translate(35,195)">
        <path d="M0,0 C-3,-12 -2,-22 0,-30" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M0,0 C3,-10 5,-20 4,-28" stroke="#81C784" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="1" cy="-31" rx="5" ry="3.5" fill="#43A047"/>
      </g>
      <g transform="translate(60,200)">
        <path d="M0,0 C-3,-12 -2,-22 0,-30" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M0,0 C3,-10 5,-20 4,-28" stroke="#81C784" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="1" cy="-31" rx="5" ry="3.5" fill="#43A047"/>
      </g>
      <g transform="translate(85,195)">
        <path d="M0,0 C-3,-12 -2,-22 0,-30" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M0,0 C3,-10 5,-20 4,-28" stroke="#81C784" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="1" cy="-31" rx="5" ry="3.5" fill="#43A047"/>
      </g>
      <g transform="translate(110,200)">
        <path d="M0,0 C-3,-12 -2,-22 0,-30" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M0,0 C3,-10 5,-20 4,-28" stroke="#81C784" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="1" cy="-31" rx="5" ry="3.5" fill="#43A047"/>
      </g>
      <g transform="translate(135,195)">
        <path d="M0,0 C-3,-12 -2,-22 0,-30" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M0,0 C3,-10 5,-20 4,-28" stroke="#81C784" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="1" cy="-31" rx="5" ry="3.5" fill="#43A047"/>
      </g>
      <g transform="translate(160,200)">
        <path d="M0,0 C-3,-12 -2,-22 0,-30" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M0,0 C3,-10 5,-20 4,-28" stroke="#81C784" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="1" cy="-31" rx="5" ry="3.5" fill="#43A047"/>
      </g>
      <g transform="translate(185,195)">
        <path d="M0,0 C-3,-12 -2,-22 0,-30" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M0,0 C3,-10 5,-20 4,-28" stroke="#81C784" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="1" cy="-31" rx="5" ry="3.5" fill="#43A047"/>
      </g>
      <g transform="translate(210,200)">
        <path d="M0,0 C-3,-12 -2,-22 0,-30" stroke="#66BB6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M0,0 C3,-10 5,-20 4,-28" stroke="#81C784" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="1" cy="-31" rx="5" ry="3.5" fill="#43A047"/>
      </g>
    </g>

    <!-- Tire tracks (damage across the field) -->
    <g opacity="0.55">
      <!-- Left track -->
      <path d="M25,236 Q70,210 120,185 Q170,160 220,148" stroke="#1B0F0A" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M25,236 Q70,210 120,185 Q170,160 220,148" stroke="#2E1A12" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="3,5"/>
      <!-- Right track -->
      <path d="M32,240 Q77,214 127,189 Q177,164 227,152" stroke="#1B0F0A" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M32,240 Q77,214 127,189 Q177,164 227,152" stroke="#2E1A12" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="3,5"/>
    </g>

    <!-- Damaged crops along tire path -->
    <g opacity="0.5">
      <g transform="translate(85,195) rotate(40)">
        <path d="M0,0 C-2,-8 -1,-14 0,-20" stroke="#8D6E63" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
      <g transform="translate(135,180) rotate(-30)">
        <path d="M0,0 C-2,-8 -1,-14 0,-20" stroke="#8D6E63" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Field border fence -->
  <rect x="20" y="130" width="216" height="106" rx="12" fill="none" stroke="#33691E" stroke-width="2.5" opacity="0.7"/>

  <!-- Main icon: Red/orange penalty card (like a football card) -->
  <g transform="translate(128, 68)" filter="url(#shadow)">
    <!-- Card shape -->
    <rect x="-32" y="-52" width="64" height="88" rx="6" ry="6" fill="url(#redBan)"/>
    <rect x="-28" y="-48" width="56" height="80" rx="4" ry="4" fill="none" stroke="#FFCDD2" stroke-width="1" opacity="0.3"/>
    
    <!-- Exclamation mark on card -->
    <rect x="-5" y="-36" width="10" height="40" rx="5" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="0" cy="20" r="6.5" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Dollar/coin penalty badge (top-right) -->
  <g transform="translate(195, 42)" filter="url(#shadowSm)">
    <circle cx="0" cy="0" r="20" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#E65100" stroke-width="1.5" opacity="0.4"/>
    <text x="0" y="7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#BF360C">$</text>
  </g>

  <!-- Small field boundary marker (top-left) -->
  <g transform="translate(52, 42)" filter="url(#shadowSm)">
    <circle cx="0" cy="0" r="20" fill="#263238" opacity="0.85"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#EF5350" stroke-width="3.5"/>
    <line x1="-9" y1="-9" x2="9" y2="9" stroke="#EF5350" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom text: FIELD PENALTY -->
  <text x="128" y="248" text-anchor="middle" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-size="17" fill="#FFFFFF" opacity="0.85" letter-spacing="2">FIELD PENALTY</text>
</svg>